config_version: "1.0.0"
storage_root: "knowledge_bases"
prompts_dir: "prompts"

chunking:
  chunk_size: 1100
  chunk_overlap: 180
  respect_sentence_boundaries: true

ollama:
  base_url: "http://localhost:11434"
  llm_model: "gemma3:4b"
  embedding_model: "embeddinggemma:latest"
  expected_embedding_dim: 768
  temperature: 0.0
  timeout_seconds: 120
  max_retries: 2

validation:
  enabled: true
  quote_repair_enabled: true
  endpoint_in_evidence_enabled: true

resolution:
  similarity_candidate_threshold: 0.82
  auto_merge_threshold: 0.95
  require_type_match: true
  use_llm_verification_for_ambiguous: true
  merge_exact_name_across_types: false
  revalidate_relationships_after_resolution: false
  enable_initial_surname_person_merge: false

leiden:
  objective: "RBConfigurationVertexPartition"
  resolution_parameter: 1.0
  random_seed: 42
  edge_weight_rule: "distinct_supporting_chunks"

retrieval:
  max_traversal_hops: 3
  max_graph_candidates: 20
  vector_top_k: 10
  community_top_k: 3
  final_context_chunks: 8
  rrf_k: 60
  max_context_chars: 12000
  provenance_expansion_enabled: false
  max_chunks_per_cooccurring_entity: 2
  max_cooccurring_entities_per_chunk: 5
  max_expanded_candidates_per_query: 10
  direct_seed_outranks_expanded: true
  max_candidates_per_seed: 5
  document_title_discovery_enabled: false
  max_title_matches_per_seed: 2
  max_chunks_per_title_match: 3
  max_title_candidates_per_query: 6
  entity_description_discovery_enabled: false
  entity_description_similarity_threshold: 0.65
  max_description_candidates_per_seed: 3
  max_description_candidates_per_query: 6
  comparative_reasoning_mode: "off"  # Default 'off'. Set 'enforce' for HotpotQA dev-set deterministic comparison heuristics.
