config_version: "1.0.0"
storage_root: "knowledge_bases"
prompts_dir: "prompts"

chunking:
  chunk_size: 1100
  chunk_overlap: 180
  respect_sentence_boundaries: true

ollama:
  base_url: "http://localhost:11434"
  llm_model: "gemma3:4b"
  embedding_model: "embeddinggemma:latest"
  expected_embedding_dim: 768
  temperature: 0.0
  timeout_seconds: 120
  max_retries: 2

resolution:
  similarity_candidate_threshold: 0.82
  auto_merge_threshold: 0.95
  require_type_match: true
  use_llm_verification_for_ambiguous: true

leiden:
  objective: "RBConfigurationVertexPartition"
  resolution_parameter: 1.0
  random_seed: 42
  edge_weight_rule: "distinct_supporting_chunks"

retrieval:
  max_traversal_hops: 3
  max_graph_candidates: 20
  vector_top_k: 10
  community_top_k: 3
  final_context_chunks: 8
  rrf_k: 60
  max_context_chars: 12000
  provenance_expansion_enabled: false
  max_chunks_per_cooccurring_entity: 2
  max_cooccurring_entities_per_chunk: 5
  max_expanded_candidates_per_query: 10
  direct_seed_outranks_expanded: true
